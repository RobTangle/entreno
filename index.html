<style>

html,body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-transform:lowercase}
input,textarea,select{text-transform:none}
body{padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 90px)}
h1{font-size:26px;margin:8px 0 14px}h2{font-size:20px;margin:18px 0 10px}
.top{display:flex;align-items:center;gap:10px}.top h1{flex:1;margin:8px 0}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:15px}
button{font:inherit;text-transform:lowercase;border:0;border-radius:14px;min-height:52px;padding:0 18px;background:var(--card2);color:var(--tx);cursor:pointer}

.big{width:100%;min-height:68px;font-size:22px}
.sec{background:transparent;color:var(--tx);border:2px solid var(--acc);font-weight:700}

.navex button{flex:1;min-height:58px;font-size:16px;font-weight:700}
.circuit{width:100%;margin:8px 0 12px}
.circuit.on{background:var(--acc);color:#111;font-weight:700}
.vueltas{font-size:22px;font-weight:800;color:var(--acc);margin:4px 0}
.row{display:flex;gap:10px}.row>*{flex:1}
.ico{min-width:52px;padding:0;font-size:22px;flex:0 0 52px}
.ex{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:12px;padding:8px 8px 8px 12px;margin:8px 0;flex-wrap:wrap}
.ex .t{flex:1}.ex button{min-height:44px;min-width:44px;padding:0;flex:0 0 44px}
.ex .howto{flex:1 1 100%;min-width:0;padding:0 12px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}

.seg{display:flex;gap:6px}.seg button{flex:1}.seg .on{background:var(--acc);color:#111;font-weight:700}
.timer{font-size:96px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0;letter-spacing:-2px}
.phase{text-align:center;font-size:20px;color:var(--acc);font-weight:700}
.exname{font-size:30px;font-weight:800;margin:4px 0}
.target{font-size:24px;margin:6px 0}
.pill{display:inline-block;background:var(--card2);border-radius:99px;padding:4px 12px;font-size:15px;margin:2px 4px 2px 0}

<script>

const $=s=>document.querySelector(s);
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();

const LIBRARY=[
  {name:'sentadilla goblet',img:'img/01-sentadilla-goblet_75b3.png',credit:'kettlebell kings',

  {name:'remo a una mano',img:'img/02-remo-a-una-mano_74da.png',credit:'kettlebell kings',

  {name:'press de hombros a una mano',img:'img/03-press-de-hombros_1a05.png',credit:'kettlebell kings',

    seguro:['costillas abajo: no arquees la lumbar para terminar la repetición.','muñeca firme, la pesa queda sobre el antebrazo.','pies quietos, rodillas un poco blandas.','pará si pinza el hombro o duele la zona lumbar.']},
  {name:'swing',img:'img/04-swing_5b65.png',credit:'onnit',

    seguro:['la zona lumbar queda apoyada todo el tiempo.','no aguantes la respiración.','cuello relajado, sin tirar de la cabeza.','pará si aparece dolor lumbar.']},
  {name:'curl de bíceps',credit:'ilustración',
    imgs:[

      {src:'img/13-curl-biceps-fin.png',label:'posición final'}

function findGuide(name){
  const n=norm(name);
  if(!n)return null;
  let best=null,len=0;
  for(const g of LIBRARY){
    const k=norm(g.name);
    if(n.includes(k)&&k.length>len){best=g;len=k.length}
  }
  if(best)return best;
  const loose=LIBRARY.filter(g=>norm(g.name).includes(n)&&n.length>=4);
  return loose.length===1?loose[0]:null;
}
function ytUrl(name){
  return 'https://www.youtube.com/results?search_query='+encodeURIComponent(name+' kettlebell tecnica');
}

function makeEx(name,sets,reps,weight,rest,note,secs){
  return {id:uid(),name,sets,mode:secs?'time':'reps',reps:reps||'',secs:secs||0,weight:weight||'',rest,note:note||''};
}
function drill(name,secs,cue,guide){
  return {id:uid(),name,secs,cue,guide:guide||''};
}
function warmupA(){
  return [
    drill('jumping jacks o trote en el lugar',60,'un minuto a ritmo cómodo, apoyá blando y no te quedes sin aire.',''),
    drill('círculos de cadera por lado',40,'10 por lado, círculos amplios y lentos, con el torso quieto.',''),
    drill('sentadillas sin peso lentas',40,'10 reps lentas, talones apoyados y rodillas hacia los pies.','sentadilla goblet'),
    drill('bisagras de cadera (good mornings sin peso)',40,'10 good mornings sin peso: cola atrás, espalda neutra, rodillas blandas.','swing'),
    drill('círculos de brazos',35,'10 círculos amplios, hombros lejos de las orejas, sin tironear.','press de hombros a una mano'),
    drill('flexiones de codo sin peso',30,'8 por brazo, codo quieto al costado y la palma adelante.','curl de bíceps'),
    drill('flexiones inclinadas o en rodillas',40,'8 reps con el cuerpo en línea. si se desarma, apoyá las rodillas.','flexiones'),
    drill('swings livianos con el de 8 kg',40,'10 swings con el de 8 kg: es una bisagra y la pesa sube hasta el pecho.','swing')
  ];
}
function warmupB(){
  return [
    drill('trote en el lugar',60,'un minuto suave, apoyá blando y mové los brazos.',''),
    drill('puentes de glúteos sin peso',40,'10 reps sin peso, pausá arriba apretando glúteos y sin arquear la lumbar.','puente de glúteos'),
    drill('sentadillas sin peso lentas',40,'8 reps lentas, talones apoyados y rodillas hacia los pies.','sentadilla goblet'),
    drill('círculos de hombros y brazos',40,'10 círculos amplios hacia atrás, hombros lejos de las orejas.','press de piso'),
    drill('apertura de pecho y brazos al techo',40,'8 veces: abrí el pecho y llevá los brazos arriba, costillas abajo, sin arquear la lumbar.','pullover con kettlebell'),
    drill('flexiones de codo sin peso',35,'10 por brazo, codo quieto al costado y la palma adelante, sin peso.','curl de bíceps'),
    drill('flexiones inclinadas',40,'8 reps con las manos altas y la cadera firme.','flexiones'),
    drill('dead bugs por lado lentos',45,'5 por lado, bien lentos, sin despegar la lumbar del piso.','dead bug')
  ];
}
function warmupFromExercises(exercises){
  const names=(exercises||[]).map(e=>norm(e.name));
  const has=(...ks)=>ks.some(k=>names.some(n=>n.includes(norm(k))));
  const drills=[drill('trote en el lugar',60,'un minuto suave para subir la temperatura, apoyando blando.','')];
  if(has('sentadilla'))drills.push(drill('sentadillas sin peso lentas',40,'10 reps lentas, talones apoyados y rodillas hacia los pies.','sentadilla goblet'));
  if(has('zancada'))drills.push(drill('zancadas hacia atrás sin peso por pierna',50,'6 por pierna, paso largo y la rodilla sigue el pie.','zancada hacia atrás'));
  if(has('peso muerto','rumano','bisagra','swing'))drills.push(drill('bisagras de cadera sin peso',40,'10 reps, cola atrás y espalda neutra.','peso muerto rumano'));
  if(has('swing'))drills.push(drill('swings livianos con el de 8 kg',40,'10 swings suaves: bisagra, la pesa hasta el pecho.','swing'));
  if(has('press de hombros','pullover'))drills.push(drill('círculos de hombros y brazos',40,'10 círculos amplios hacia atrás, hombros lejos de las orejas.','press de hombros a una mano'));
  if(has('pullover'))drills.push(drill('brazos al techo y apertura de pecho',40,'8 veces, brazos arriba y pecho abierto, sin arquear la lumbar.','pullover con kettlebell'));
  if(has('curl'))drills.push(drill('flexiones de codo sin peso',35,'10 por brazo, codo quieto al costado, sin carga.','curl de bíceps'));
  if(has('remo'))drills.push(drill('pull-aparts con banda',35,'10 reps juntando los omóplatos, sin encoger.','remo con banda'));
  if(has('flexiones','press de piso','press de hombros'))drills.push(drill('flexiones inclinadas',40,'8 reps con las manos altas y el cuerpo en línea.','flexiones'));
  if(has('puente','gluteo'))drills.push(drill('puentes de glúteos sin peso',40,'10 reps, pausa arriba, sin empujar con la lumbar.','puente de glúteos'));
  if(has('dead bug'))drills.push(drill('dead bugs por lado lentos',45,'5 por lado, lumbares apoyadas, sin apuro.','dead bug'));

}
function warmupFor(routine){
  const n=norm(routine.name);
  if(n===norm('sentadilla, remo y swing'))return warmupA();
  if(n===norm('tren superior y glúteos')||n===norm('peso muerto, zancada y glúteos'))return warmupB();
  return warmupFromExercises(routine.exercises||[]);
}

function applyStandard(r,fresh){
  r.name=fresh.name;
  r.exercises=fresh.exercises;
  r.warmup=fresh.warmup;
}
/* schema 3 replaces the two standard routines. any other name is left alone,
   and history is never rewritten. */
function refreshStandardRoutines(S){
  (S.routines||[]).forEach(r=>{
    const n=norm(r.name);
    if(n===norm('sentadilla, remo y swing')||n==='fuerza a'||n==='fuerza a (kettlebells)')applyStandard(r,routineA());
    else if(n===norm('tren superior y glúteos')||n===norm('peso muerto, zancada y glúteos')||/^fuerza b\b/.test(n))applyStandard(r,routineB());
  });
  if(S.active&&S.active.rid){
    const ar=S.routines.find(r=>r.id===S.active.rid);
    if(ar)S.active.name=ar.name;
  }
}
/* schema 2 renames legacy routines, adds wednesday if it was never there,
   and attaches a warm-up. schema 3 then refreshes the two standard routines. */
function migrate(S){
  const from=S.schema||0;
  if(from>=SCHEMA)return S;
  if(from<2){
    let sawB=false;
    S.routines.forEach(r=>{
      const n=norm(r.name);
      if(n==='fuerza a (kettlebells)'||n==='fuerza a')r.name='sentadilla, remo y swing';
      else if(/^fuerza b\b/.test(n))r.name='peso muerto, zancada y glúteos';
      if(norm(r.name)===norm('peso muerto, zancada y glúteos'))sawB=true;
    });
    if(!sawB)S.routines.push(routineB());
    S.routines.forEach(r=>{
      if(!Array.isArray(r.warmup))r.warmup=warmupFor(r);
    });
    if(S.active&&S.active.rid){
      const ar=S.routines.find(r=>r.id===S.active.rid);
      if(ar)S.active.name=ar.name;
    }
  }
  if(from<3)refreshStandardRoutines(S);
  S.schema=SCHEMA;
  return S;
}

}

function beep(n=3){
  try{if(!actx)return;let t=actx.currentTime;
    for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=i===n-1?1320:880;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.3,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+(i===n-1?0.45:0.18));
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+0.5);t+=0.28}}catch(_){}
  try{navigator.vibrate&&navigator.vibrate([300,120,300,120,500])}catch(_){}
}

}

function vWarmup(){

    </div>

function roundCount(A){let m=1;(A.ex||[]).forEach(e=>{const n=+e.sets||1;if(n>m)m=n});return m}
function doneCount(A,i){return ((A.log[i]&&A.log[i].sets)||[]).filter(s=>!s.skip).length}
function workoutHasRealSets(A){return (A.log||[]).some(l=>(l.sets||[]).some(s=>!s.skip))}
function circuitToggleHtml(){
  const A=S.active;if(!A)return '';
  const on=!!A.circuit;
  if(workoutHasRealSets(A))return on?'<div class="pill">modo circuito</div>':'';
  return `<button type="button" class="circuit${on?' on':''}" data-circuit="${on?'on':'off'}" onclick="toggleCircuit()">modo circuito: ${on?'sí':'no'}</button>`;
}
function toggleCircuit(){
  const A=S.active;if(!A||workoutHasRealSets(A))return;
  A.circuit=!A.circuit;A.round=0;
  const r=R(A.rid);if(r)r.circuit=!!A.circuit;
  save();render();
}
function findCircuit(fromI,fromRound){
  const A=S.active;if(!A)return null;
  const Y=roundCount(A);
  let i=fromI,round=fromRound||0;
  for(let n=0;n<A.ex.length*Y+1;n++){
    i++;
    if(i>=A.ex.length){round++;i=0}
    if(round>=Y)return null;
    const e=A.ex[i];
    const filled=((A.log[i]&&A.log[i].sets)||[]).length;
    if((+e.sets||1)>round && filled<(+e.sets||1))return {i,round};
  }
  return null;
}
function stepCircuit(){
  const A=S.active;if(!A)return;
  const n=findCircuit(A.i,A.round||0);
  if(!n){finishWorkout(true);return}
  A.i=n.i;A.round=n.round;A.s=doneCount(A,A.i);A.phase='ready';A.end=0;primeCur();
}
function nextLabel(){
  const A=S.active,e=A.ex[A.i];
  if(A.circuit){
    const n=findCircuit(A.i,A.round||0);
    if(!n)return 'fin 🎉';
    return `vuelta ${n.round+1}: ${A.ex[n.i].name}`;
  }
  if(A.s<e.sets)return `serie ${A.s+1} de ${e.name}`;
  const n=A.ex[A.i+1];return n?n.name:'fin 🎉';
}
function adj(k,d){const A=S.active,el=$('#c_'+k);let v=parseFloat(String(el.value).replace(',','.'))||0;
  const step=k==='kg'?1:(A.ex[A.i].mode==='time'?5:1);v=Math.max(0,v+d*step);A.cur[k]=String(v);el.value=v;save()}
function readCur(){const A=S.active;const r=$('#c_reps'),k=$('#c_kg');if(r)A.cur.reps=r.value.trim();if(k)A.cur.kg=k.value.trim()}
function startWork(){readCur();unlockAudio();const A=S.active,e=A.ex[A.i];A.phase='work';A.end=Date.now()+e.secs*1000;A.workStart=Date.now();save();render()}
function endWork(){const A=S.active;const did=Math.round((Date.now()-A.workStart)/1000);A.cur.reps=String(Math.min(did,A.ex[A.i].secs));A.phase='ready';setDone(true)}
function setDone(fromWork){
  if(!fromWork)readCur();unlockAudio();const A=S.active;if(!A||A.phase==='done')return;
  const e=A.ex[A.i];
  if(!A.cur)primeCur();
  const row={reps:A.cur.reps===''?(e.mode==='time'?(e.secs||''):(e.reps||'')):A.cur.reps};
  if(hasLoad(e.weight))row.kg=A.cur.kg||e.weight||'';
  A.log[A.i].sets.push(row);
  if(A.circuit){
    const nxt=findCircuit(A.i,A.round||0);
    if(!nxt){finishWorkout(true);return}
    if((e.rest||0)>0){A.phase='rest';A.end=Date.now()+e.rest*1000;save();render();return}
    stepCircuit();
    if(A.phase!=='done'){save();render()}
    return;
  }
  A.s=doneCount(A,A.i);
  const last=A.i===A.ex.length-1&&A.s>=(e.sets||1);
  if(last){finishWorkout(true);return}
  if((e.rest||0)>0){A.phase='rest';A.end=Date.now()+e.rest*1000}else advance();
  save();render();
}
function advance(){
  const A=S.active;if(!A||A.phase==='done')return;
  A.phase='ready';A.end=0;
  if(A.circuit){stepCircuit();return}
  const e=A.ex[A.i];
  if(A.s>=(e.sets||1)){
    if(A.i>=A.ex.length-1){finishWorkout(true);return}
    A.i++;
  }
  if(A.phase==='done')return;
  A.s=doneCount(A,A.i);
  primeCur();
}
function endRest(){advance();if(!S.active||S.active.phase==='done')return;save();render()}
function addTime(d){const A=S.active;A.end=Math.max(Date.now()+1000,A.end+d*1000);save();render()}
function placeOn(i){
  const A=S.active,e=A.ex[i];
  A.i=i;A.phase='ready';A.end=0;
  A.s=doneCount(A,i);
  if(!A.circuit && A.s>=(e.sets||1))A.s=Math.max(0,(e.sets||1)-1);
  primeCur();
}
function skipEx(){
  const A=S.active;if(!A)return;
  if(A.circuit){
    const n=findCircuit(A.i,A.round||0);
    if(!n){finishWorkout();return}
    A.round=n.round;placeOn(n.i);save();render();return;
  }
  if(A.i>=A.ex.length-1){finishWorkout();return}
  placeOn(A.i+1);save();render();
}
function prevEx(){
  const A=S.active;if(!A)return;
  if(A.circuit){
    const Y=roundCount(A);
    let i=A.i,round=A.round||0;
    for(let n=0;n<A.ex.length*Y;n++){
      i--;
      if(i<0){round--;i=A.ex.length-1}
      if(round<0)return;
      const e=A.ex[i];
      const filled=((A.log[i]&&A.log[i].sets)||[]).length;
      if((+e.sets||1)>round && filled<(+e.sets||1)){A.round=round;placeOn(i);save();render();return}
    }
    return;
  }
  if(A.i===0)return;
  placeOn(A.i-1);save();render();
}
function exerciseDone(){
  const A=S.active;if(!A||A.phase==='done')return;
  const e=A.ex[A.i];
  const have=((A.log[A.i]&&A.log[A.i].sets)||[]).length;
  const remain=Math.max(0,(+e.sets||1)-have);
  if(remain>0){
    const msg=remain===1?'¿dar por hecho este ejercicio? queda 1 serie, la marco salteada.':'¿dar por hecho este ejercicio? quedan '+remain+' series, las marco salteadas.';
    if(!confirm(msg))return;
  }
  for(let k=0;k<remain;k++)A.log[A.i].sets.push({reps:'',skip:true});
  A.phase='ready';A.end=0;
  if(A.circuit){
    if(!findCircuit(A.i,A.round||0)){finishWorkout(true);return}
    stepCircuit();
    if(A.phase!=='done'){save();render()}
    return;
  }
  if(A.i>=A.ex.length-1){finishWorkout(true);return}
  placeOn(A.i+1);save();render();
}
function loggedExercises(log){
  return (log||[]).map(l=>({name:l.name,sets:(l.sets||[]).filter(s=>!s.skip).map(s=>{const row={reps:s.reps};if(s.kg)row.kg=s.kg;return row})})).filter(l=>l.sets.length);
}
function finishWorkout(auto){
  const A=S.active;if(!A||A.phase==='done')return;
  if(!auto&&!confirm('¿terminar y guardar el entreno?'))return;
  const sets=loggedExercises(A.log);
  if(sets.length){S.history.unshift({id:uid(),date:new Date(A.start).toISOString(),routine:A.name,minutes:Math.max(1,Math.round((Date.now()-A.start)/60000)),exercises:sets})}
  A.phase='done';A.saved=sets.length>0;save();wakeOff();if(auto)beep(4);render();
}
function vDone(){const A=S.active,h=S.history[0];
  return `<h1>¡bien ahí! 💪</h1><div class="card">${A.saved?`<b>${esc(h.routine)}</b><div class="mut">${h.minutes} min · ${h.exercises.reduce((a,x)=>a+x.sets.length,0)} series</div>`:'no se registró ninguna serie, así que no guardé nada.'}</div>

const MEALS=['desayuno','almuerzo','merienda','cena'];
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function weekDates(today){
  const start=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const dow=start.getDay();
  start.setDate(start.getDate()+(dow===0?-6:1-dow));
  const out=[];
  for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);out.push(d)}
  return out;
}
function dayLabel(d){return d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'short'})}
function expandMeal(text,plantillas){
  const raw=String(text??'').trim();
  if(!raw||!plantillas)return raw;
  const keys=Object.keys(plantillas).sort((a,b)=>norm(b).length-norm(a).length);
  const folded=norm(raw);
  for(const key of keys){
    const nkey=norm(key);
    if(!nkey)continue;
    if(folded===nkey)return String(plantillas[key]);
    if(!folded.startsWith(nkey+' '))continue;
    const head=raw.slice(0,key.length);
    if(norm(head)!==nkey)continue;
    const rest=raw.slice(key.length).trim();
    return String(plantillas[key])+(rest?', '+rest:'');
  }
  return raw;
}
function mealHtml(day,plantillas){
  return MEALS.map(m=>{
    const val=day&&day[m];
    if(val==null||!String(val).trim())return '';
    return `<div class="meal"><b>${esc(m)}</b><div>${esc(expandMeal(val,plantillas))}</div></div>`;
  }).join('');
}
function loadMenu(key){
  if(menuState.inflight===key)return;
  menuState.inflight=key;
  menuState.key=key;
  menuState.status='loading';
  const req=++menuReq;
  fetch('menu.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('menu');return r.json()}).then(data=>{
    if(req!==menuReq)return;
    menuState.status='ready';
    menuState.data=data&&typeof data==='object'?data:{};
    menuState.inflight='';
    if(view.name==='comida')render();
  }).catch(()=>{
    if(req!==menuReq)return;
    menuState.status='error';
    menuState.data=null;
    menuState.inflight='';
    if(view.name==='comida')render();
  });
}
function retryMenu(){menuState.status='idle';menuState.inflight='';menuState.key='';render()}
function toggleSemana(){menuState.week=!menuState.week;render()}
function vComida(){
  const today=new Date();
  const key=ymd(today);
  if(menuState.inflight!==key&&(menuState.key!==key||menuState.status==='idle'))loadMenu(key);
  let body;
  if(menuState.status==='error'&&menuState.key===key){
    body=`<div class="empty">no pude cargar el menú.</div><button class="big" onclick="retryMenu()">reintentar</button>`;
  }else if(menuState.status!=='ready'||menuState.key!==key){
    body=`<div class="empty">cargando el menú…</div>`;
  }else{
    const data=menuState.data||{};
    const dias=data.dias||{};
    const plantillas=data.plantillas||{};
    const day=dias[key];
    body=`<div class="card" data-hoy data-dia="${key}"><b>${esc(dayLabel(today))}</b>${day?mealHtml(day,plantillas):'<p class="mut">no hay menú cargado para hoy</p>'}</div>`;
    body+=`<button class="big" data-semana-toggle onclick="toggleSemana()">${menuState.week?'ocultar el resto de la semana':'ver el resto de la semana'}</button>`;
    if(menuState.week){
      body+='<div data-semana>';
      weekDates(today).forEach(d=>{
        const k=ymd(d);
        if(k===key)return;
        const dd=dias[k];
        body+=`<div class="card" data-dia="${k}"><b>${esc(dayLabel(d))}</b>${dd?mealHtml(dd,plantillas):'<p class="mut">sin menú</p>'}</div>`;
      });
      body+='</div>';
    }
  }
  return `<div class="top"><button class="ico" onclick="go('home')">←</button><h1>comida de hoy</h1></div>${body}`;
}
function csvCell(v){v=String(v??'');return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function buildCSV(){const rows=[['fecha','hora','rutina','minutos_total','ejercicio','serie','reps_o_seg','kg']];
  S.history.slice().reverse().forEach(w=>{const d=new Date(w.date);const f=d.toLocaleDateString('sv-SE'),t=d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false});
    w.exercises.forEach(x=>x.sets.forEach((s,k)=>rows.push([f,t,w.routine,w.minutes,x.name,k+1,s.reps,s.kg])))});
  return rows.map(r=>r.map(csvCell).join(',')).join('\n')}
function exportCSV(){const csv='\ufeff'+buildCSV();const name='entrenos-'+new Date().toLocaleDateString('sv-SE')+'.csv';
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const file=window.File?new File([blob],name,{type:'text/csv'}):null;
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>dl(blob,name));return}
  dl(blob,name)}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

/* ---------- render loop ---------- */
function render(){
  const v={home:vHome,edit:vEdit,workout:vWorkout,history:vHistory,comida:vComida}[view.name]||vHome;
  $('#app').innerHTML=v()+nav();
  clearInterval(tick);tick=null;
  const A=S.active;
  const timed=A&&(A.phase==='rest'||A.phase==='work'||A.phase==='warmup');
  if(view.name==='workout'&&timed)tick=setInterval(onTick,250);
  else if(timed)tick=setInterval(()=>{if(Date.now()>=A.end)onTick()},500);
}
let lastSec=null;
function onTick(){
  const A=S.active;if(!A||(A.phase!=='rest'&&A.phase!=='work'&&A.phase!=='warmup')){clearInterval(tick);return}
  const left=(A.end-Date.now())/1000,el=$('#timer');
  if(el)el.textContent=fmt(left);
  const sec=Math.ceil(left);if(sec!==lastSec&&sec<=3&&sec>0){shortBeep()}lastSec=sec;
  if(left<=0){
    if(A.phase==='warmup'){
      const last=A.wui>=(A.wu||[]).length-1;
      if(last)beep(3);else shortBeep();
      nextWarm();save();if(view.name!=='workout')view.name='workout';render();
      const c=$('.card');c&&c.classList.add('flash');return;
    }
    beep(3);if(A.phase==='rest'){advance()}else{A.phase='ready';A.cur.reps=String(A.ex[A.i].secs);setDone(true);return}
    save();if(view.name!=='workout')view.name='workout';render();const c=$('.card');c&&c.classList.add('flash')}
}
